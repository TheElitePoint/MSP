# US geography for city-by-city discovery.
# `iso` is the ISO3166-2 code used by the Overpass area lookup.
# `cities` are ordered by expected MSP / mid-market IT density — the pipeline
# takes the first N (settings.discovery.tavily.cities_per_state) per state.

